name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Build backend
        run: npm run build:backend

      - name: Build frontend
        run: npm run build:frontend

      - name: Prune backend
        run: node scripts/prune-backend.js

      - name: Publish
        run: node scripts/publish.js
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
